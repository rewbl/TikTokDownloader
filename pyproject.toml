[tool.poetry]
name = "tiktok-downloader"
version = "0.1.0"
description = "TikTok/Douyin video downloader and bookmark manager"
authors = ["StudioY"]
readme = "README.md"
packages = [{include = "app"}, {include = "DouyinEndpoints"}, {include = "FileDownload"}, {include = "StudioY"}, {include = "Slack"}]

[tool.poetry.dependencies]
python = "^3.11"
aiohappyeyeballs = "^2.4.4"
aiohttp = "^3.11.7"
aiosignal = "^1.3.1"
annotated-types = "^0.7.0"
attrs = "^24.2.0"
blinker = "^1.9.0"
boto3 = "^1.35.76"
botocore = "^1.35.76"
certifi = "^2024.8.30"
charset-normalizer = "^3.4.0"
click = "^8.1.7"
colorama = "^0.4.6"
dnspython = "^2.7.0"
emoji = "^2.14.0"
et-xmlfile = "^2.0.0"
Flask = "^3.1.0"
frozenlist = "^1.5.0"
idna = "^3.10"
itsdangerous = "^2.2.0"
Jinja2 = "^3.1.4"
jmespath = "^1.0.1"
lxml = "^5.3.0"
markdown-it-py = "^3.0.0"
MarkupSafe = "^3.0.2"
mdurl = "^0.1.2"
motor = "^3.6.0"
multidict = "^6.1.0"
numpy = "^2.1.3"
openpyxl = "^3.1.5"
pandas = "^2.2.3"
propcache = "^0.2.1"
pydantic = "^2.10.3"
pydantic-core = "^2.27.1"
Pygments = "^2.18.0"
pymongo = "^4.9.2"
python-dateutil = "^2.9.0"
pytz = "^2024.2"
qrcode = "^8.0"
requests = "^2.32.3"
rich = "^13.9.4"
s3transfer = "^0.10.4"
six = "^1.17.0"
slack-sdk = "^3.31.0"
typing-extensions = "^4.12.2"
tzdata = "^2024.2"
urllib3 = "^1.25.4"
Werkzeug = "^3.1.3"
yarl = "^1.18.3"
"99notion-base" = {version = ">=0.1.0,<0.2.0", source = "private-pypi"}

[[tool.poetry.source]]
name = "private-pypi"
url = "https://pypi.9zma.com/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
